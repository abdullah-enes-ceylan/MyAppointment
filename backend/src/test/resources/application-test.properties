# ============================================================
#  TESTCONTAINERS PROFILI -- sadece @SpringBootTest ile calisan
#  gercek-Postgres entegrasyon testleri icin (bkz. BackendApplicationTests).
#
#  Veritabani baglantisi burada YOK: @ServiceConnection, testin actigi
#  PostgreSQLContainer'in baglanti bilgilerini otomatik enjekte ediyor --
#  hicbir spring.datasource.* degeri elle yazilmiyor/yazilmamali.
#
#  Bu dosya sadece "dev" ve "prod" disindaki degerlerin varsayilani
#  olmadigi (fail-fast) iki alani karsiliyor: jwt.secret ve
#  app.cors.allowed-origins (bkz. JwtUtil, SecurityConfig). Gercek bir
#  sir DEGIL -- sadece context'in acilabilmesi icin gereken bir deger.
#
#  DatabaseSeeder BILEREK calismiyor: o @Profile("dev")'e kilitli, bu
#  profil "test" oldugu icin devreye girmiyor -- bu test sahte Istanbul
#  verisiyle degil, TERTEMIZ bir semayla context'in ve migration'larin
#  gercekten calistigini dogruluyor.
# ============================================================

jwt.secret=test-profili-icin-uretilmis-32-bayttan-uzun-sahte-bir-deger
app.cors.allowed-origins=http://localhost:*
spring.jpa.hibernate.ddl-auto=validate

# ============================================================
#  URETIM AYARLARI
#
#  BU DOSYA GIT'E GIRER ama icinde tek bir sir yoktur.
#  Butun hassas degerler ortam degiskeninden okunur.
#
#  Dikkat: ${VAR} yazarken bilerek varsayilan deger VERMIYORUZ.
#  Boylece degisken tanimli degilse uygulama aciliste hata verip
#  durur (fail-fast). Sessizce yanlis/zayif bir varsayilanla
#  calismasindansa hic acilmamasi cok daha guvenlidir.
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# --- JPA / Hibernate ---
# validate: Hibernate semayi DEGISTIRMEZ, sadece entity'lerle uyusuyor mu diye
# bakar. Uretimde "update" veya "create-drop" veri kaybi demektir.
# Sema degisiklikleri yalnizca Flyway migration'lari ile yapilir (Faz 1.4).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- JWT ---
jwt.secret=${JWT_SECRET}

# --- CORS ---
# Virgulle ayrilmis gercek frontend domain(ler)i, ornek:
# CORS_ALLOWED_ORIGINS=https://randevum.com,https://www.randevum.com
# Bilerek varsayilan YOK: bu deger tanimsizsa uygulama acilmamali (fail-fast).
# localhost buraya ASLA yazilmaz -- dev'deki gibi wildcard host+port kalibi
# allowCredentials(true) ile birlikte prod'da gercek bir risk olurdu.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- Ters vekil (Caddy/Nginx) arkasinda dogru sema ve istemci IP'si icin ---
server.forward-headers-strategy=native

# --- Hata yanitlari: ic detay disari sizmaz ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# --- PII: Hibernate'in KENDI dahili JDBC hata logger'i ---
# Canli testte (Faz 3.6) bulundu: bir unique kisit ihlalinde (ornegin
# users.email) Hibernate'in org.hibernate.orm.jdbc.error logger'i, bizim
# GlobalExceptionHandler'imizdan TAMAMEN BAGIMSIZ, PostgreSQL'in ham "Key
# (email)=(gercek@eposta.com) already exists." mesajini ayri bir log
# satirinda basiyor -- PiiMasker bu satira hic dokunamiyor, biz onu hic
# cagirmiyoruz. Sadece prod'da kapatiliyor: constraint adi (ornegin
# "users_email_key") zaten GlobalExceptionHandler'in KENDI (maskelenmis)
# log satirinda duruyor, bilgi kaybi yok. Dev/test'te acik kaliyor --
# gercek musteri verisi yok, hata ayiklamada faydali.
logging.level.org.hibernate.orm.jdbc.error=OFF

# --- Yapisal (JSON) log — sadece prod ---
# Dev/test'te insan-okunabilir renkli konsol cikisi kaliyor (gelistirici
# deneyimi icin daha iyi); prod'da log toplama/arama araclarinin (ELK,
# Loki, CloudWatch vb.) ayristirabilecegi tek satirlik JSON'a geciliyor.
# Bu property Spring Boot 4.0.7'de NATIF olarak taniniyor -- canli
# dogrulandi (bir test JVM'ine sistem property olarak gecilip cikti
# gercek ECS-semali JSON'a dondu) -- ayrica bir logback-spring.xml veya
# logstash-logback-encoder bagimliligi gerekmiyor. ECS (Elastic Common
# Schema), herhangi bir belirli log toplama araci secilmeden once de
# genis kabul goren, alan isimleri standartlastirilmis bir JSON semasi.
logging.structured.format.console=ecs

# --- API dokumantasyonu (Faz 3.3) ---
# Swagger UI + OpenAPI semasi prod'da TAMAMEN kapali -- API yuzeyini
# (hangi uclar var, hangi DTO alanlari bekleniyor) herkese ilan etmenin
# beta asamasinda hicbir faydasi yok, sadece saldirgana kesif bilgisi
# verir. Dev/test'te varsayilan (enabled=true) kalir.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Isletme kapak fotografi depolamasi: Cloudflare R2 (Faz 3.15) ---
# BILEREK sabit deger, degisken DEGIL -- prod'un yerel disk (local) ile
# ayaga kalkabilmesi bir secenek olmamali (bkz. NOTLAR.md "R2'ye tasima"
# karari). Varsayilana (local) guvenilseydi, storage-provider satiri
# yanlislikla silinirse fotograflar farkedilmeden container'in gecici
# diskine yazilmaya baslardi.
app.business-photo.storage-provider=r2
app.business-photo.r2.account-id=${R2_ACCOUNT_ID}
app.business-photo.r2.bucket-name=${R2_BUCKET_NAME}
app.business-photo.r2.access-key-id=${R2_ACCESS_KEY_ID}
app.business-photo.r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
app.business-photo.r2.public-base-url=${R2_PUBLIC_BASE_URL}

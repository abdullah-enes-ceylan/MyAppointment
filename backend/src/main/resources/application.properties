spring.application.name=backend
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/appointment_db
spring.datasource.username=postgres
spring.datasource.password=***KALDIRILDI-DB-PAROLASI***

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.output.ansi.enabled=ALWAYS

# JWT Ayarları
# Gizli anahtar (En az 32 karakter olmalı, rastgele uzun bir metin yazdım)
jwt.secret=***KALDIRILDI-JWT-SECRET***
# Token geçerlilik süresi (Milisaniye cinsinden - Örnekte 24 saat: 1000 * 60 * 60 * 24 = 86400000)
jwt.expiration=86400000
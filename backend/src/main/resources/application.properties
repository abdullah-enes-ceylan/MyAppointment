# ============================================================
#  ORTAK AYARLAR — Tum profillerde gecerli.
#  BU DOSYA GIT'E GIRER. Buraya asla sir (parola, secret) yazma.
#  Ortama gore degisen her sey application-{profil}.properties'te.
# ============================================================

spring.application.name=backend
server.port=8080

# Aktif profil. Ortam degiskeni ile ezilir, verilmezse "dev" calisir.
# Uretimde: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- JPA / Hibernate (ortak) ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.output.ansi.enabled=ALWAYS

# --- JWT ---
# Token gecerlilik suresi (milisaniye). 86400000 ms = 24 saat.
# Sir olmadigi icin burada durabilir; jwt.secret profil dosyalarindan gelir.
jwt.expiration=86400000

# --- Randevu musaitlik hesaplamasi ---
# Bos saat dilimlerinin ilerledigi sabit izgara araligi (dakika). Hizmetin
# kendi suresinden BAGIMSIZ - 15 dk'lik bir izgarada 45 dk'lik bir hizmet
# 09:00, 09:15, 09:30... gibi noktalarda teklif edilebilir, sadece 09:00,
# 09:45, 10:30 degil. bkz. AvailabilityCalculator.
app.scheduling.slot-granularity-minutes=15

# --- Zaman ---
# Uygulamanin TEK saat dilimi. TimeConfig hem Clock bean'ini hem JVM
# varsayilanini buna gore sabitliyor. Butun zaman kolonlari veritabaninda
# "timestamp without time zone" (yani ciplak duvar saati) oldugu icin, bu
# degerlerin hangi dilimi ifade ettigine dair TEK otorite uygulamadir.
app.time-zone=Europe/Istanbul

# Jackson'in JSON'a yazdigi tarihler de ayni dilimde olsun -- aksi halde
# API yanitlarindaki saat ile veritabanindaki saat farkli gorunebilir.
spring.jackson.time-zone=Europe/Istanbul

# --- Randevu talebi zaman asimi ---
# Kural: dusme ani = randevu saati - min(expiry-lead-time, pencere x expiry-ratio)
# Uzun pencerelerde sabit pay, kisa pencerelerde oran devreye girer.
# Detay ve gerekce: AppointmentExpiryPolicy.
app.appointment.expiry-lead-time=1h
app.appointment.expiry-ratio=0.10

# En fazla ne kadar ileriye randevu alinabilir.
app.appointment.booking-horizon=90d

# Bir musterinin AYNI ISLETMEDE ayni anda kac cevaplanmamis talebi olabilir.
app.appointment.max-open-requests-per-business=3

# Arka plan gorevinin calisma araligi. Bu deger dogrudan hata payini
# belirliyor: dusme ani en fazla bir aralik kadar gec farkedilir. Kisa
# pencerelerde (30 dakikalik randevu -> 3 dakikalik pay) oransal olarak
# buyuk bir sapma; sikayet gelirse burayi kucultmek yeterli, kod
# degisikligi gerekmiyor.
app.appointment.scheduler-cron=0 */5 * * * *

# --- Isletme kapak fotografi ---
# Detay ve gerekce: BusinessPhotoProperties, LocalDiskBusinessPhotoStorage.
# storage-dir uygulamanin calisma dizinine gore cozumlenir (backend/ altinda
# calistirilinca backend/business-photo-storage/ olur), .gitignore'da.
app.business-photo.storage-dir=business-photo-storage
app.business-photo.max-size-bytes=5242880
app.business-photo.max-image-width-px=8000
app.business-photo.max-image-height-px=8000
app.business-photo.allowed-input-formats=JPEG,PNG
# Yer tutucu degerler -- tasarim gorseline gore netlesecek (bkz. plan
# "Acik Kalan Kararlar" madde 4).
app.business-photo.card-target-width=480
app.business-photo.detail-target-width=1200

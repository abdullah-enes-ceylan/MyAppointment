version: 2
updates:
  # Backend (Maven)
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  # Bu workflow dosyasinin kendi action surumleri (actions/checkout vb.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

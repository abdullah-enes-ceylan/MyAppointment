# backend + postgres + caddy (frontend'i de sunan reverse proxy). Asagidaki
# ${...} degiskenler bir .env dosyasindan (docker-compose'un otomatik okudugu,
# repo'ya girmez) ya da kabuk ortamindan geliyor -- gercek deploy'da bu dosya
# sunucuya ELLE kopyalanacak (tek sunucu olcegi, ayri bir secrets-manager
# gereksiz karmasiklik olurdu).

# Docker'in varsayilan json-file log driver'i SINIRSIZ buyuyor -- uzun sureli
# calisan bir prod container'i aylar icinde host diskini doldurabilir. Butun
# servisler bunu paylasiyor (YAML anchor, tekrar etmemek icin).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appointment_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
    # Postgres 18+ imaji /var/lib/postgresql/data yerine /var/lib/postgresql'in
    # KENDISINE mount edilmesini bekliyor (surum-spesifik alt dizin
    # kullaniyor artik, pg_ctlcluster ile uyumlu olmak icin) -- eski
    # konvansiyonla denendi, container "unused mount/volume" hatasiyla
    # aciliste cikti, canli duzeltildi.
    volumes:
      - postgres_data:/var/lib/postgresql
    # Backend'in Postgres KONTEYNERININ baslamasini degil, Postgres'in
    # GERCEKTEN baglanti kabul ettigini beklemesi icin -- duz depends_on
    # sadece ilkini garanti eder, Postgres init'i birkac saniye surer.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-appointment_db}"]
      interval: 3s
      timeout: 3s
      retries: 10
    # unless-stopped, on-failure DEGIL: on-failure sadece COKEN bir
    # container'i yeniden dener, DURDURULMUS bir daemon'dan sonra (ornegin
    # VPS reboot'u) container'lari OTOMATIK baslatmaz. unless-stopped hem
    # cokmeyi hem reboot'u kapsiyor, tek istisnasi elle "docker compose
    # stop" ile durdurulmus olmasi (bkz. RUNBOOK.md A6, reboot testiyle
    # dogrulaniyor).
    restart: unless-stopped

  backend:
    # Sabit isim -- yoksa Docker dizin adindan (compose project name) otomatik
    # bir isim uretir, sunucuda dizin adi farkliysa (RUNBOOK.md A4: /opt/randevum
    # varsayiliyor ama garanti degil) rollback'in bekledigi "randevum-backend"
    # etiketiyle uyusmaz (bkz. RUNBOOK.md'nin son bolumundeki `docker tag`
    # komutlari, aynen bu ismi kullaniyor).
    image: randevum-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    logging: *default-logging
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-appointment_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Isletme kapak fotografi depolamasi (Faz 3.15, bkz. NOTLAR.md "R2'ye
      # tasima" karari) -- application-prod.properties storage-provider'i
      # SABIT "r2" olarak zorluyor, yani bu bes deger prod'da HER ZAMAN
      # gercekten gerekli; ayni fail-fast desen (POSTGRES_PASSWORD/JWT_SECRET
      # ile birebir).
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?R2_ACCOUNT_ID gerekli}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?R2_BUCKET_NAME gerekli}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID gerekli}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY gerekli}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:?R2_PUBLIC_BASE_URL gerekli}
    # ONEMLI: host'a port ACILMIYOR. Tek genel giris noktasi Caddy (80/443) --
    # backend sadece docker'in ic agi uzerinden "backend:8080" adresiyle
    # erisilebilir. Boylece rate limiting/CORS gibi korumalari es gecip
    # backend'e dogrudan istek atma yolu, ta bastan yok -- bir port
    # unutkanligina bagli degil.
    expose:
      - "8080"
    # BURADA ARTIK bir isletme-fotografi volume'u YOK. Once bind mount, sonra
    # (Docker Desktop'ta gorunmeyen UID/izin sorunu yuzunden) named volume
    # olarak duzeltilmisti -- Faz 3.15'te depolama R2'ye tasinip
    # storage-provider prod'da SABIT "r2" olunca (yukaridaki ortam
    # degiskenleri), backend container'in yerel diskine hic yazmiyor,
    # volume'a gerek kalmadi. Tam gecmis: NOTLAR.md "R2'ye tasima" karari.
    depends_on:
      postgres:
        condition: service_healthy
    # unless-stopped -- postgres servisindeki gerekce ayni sekilde gecerli
    # (bkz. RUNBOOK.md A6): on-failure bir VPS reboot'undan sonra bu
    # container'i otomatik baslatmazdi.
    restart: unless-stopped

  caddy:
    # Sabit isim -- ayni gerekce (bkz. backend servisindeki not).
    image: randevum-caddy
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # BILEREK BOS: Caddy ayni origin'den hem frontend'i hem backend'i
        # sundugu icin frontend "/api/..." gibi GORELI bir yola istek atiyor
        # -- ayri bir backend adresi gerekmiyor (bkz. axios.ts, Caddyfile).
        VITE_API_URL: ""
    logging: *default-logging
    # Root KALIYOR (Caddy'nin resmi image'inin varsayilan durusu -- 80/443
    # gibi ayricalikli portlara bind etmek root gerektiriyor), ama root'un
    # YETKISI 80/443'e bind etmekle SINIRLANIYOR: once butun Linux
    # capability'leri (CAP_CHOWN, CAP_SETUID, CAP_SYS_ADMIN vb.) dusuruluyor,
    # sonra SADECE ayricalikli port'a bind etmeye yarayan capability geri
    # ekleniyor. no-new-privileges, setuid-root bir binary calistirilsa bile
    # (Caddy'nin kendisinde yok ama savunma katmani) ek yetki kazanmayi
    # engelliyor. Non-root'a tam gecis (host portu 8080'e cevirip Caddy'yi
    # ayricaliksiz portta dinletmek) otomatik HTTPS/ACME akisini bozup
    # bozmadigi gercek bir domain'le doğrulanmadan denenmeyecek (Faz 3.8).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      DOMAIN: ${DOMAIN:-:80}
      # www -> apex yonlendirme sitesi (bkz. Caddyfile). Varsayilan ":8081"
      # bilerek DOMAIN'in yerel varsayilani (":80") ile CAKISMAYAN, disaridan
      # hic erisilmeyen bir port -- yerelde zararsiz bir no-op, prod'da
      # gercek "www.<domain>" degeriyle ezilir (bkz. RUNBOOK.md A5).
      WWW_DOMAIN: ${WWW_DOMAIN:-:8081}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Sertifika/TLS state -- named volume (business-photo-storage'taki
      # "gozle gorulebilir olsun" gerekcesi burada gecerli degil, bu veri
      # insan tarafindan okunacak bir sey degil). Bu OLMADAN her container
      # yeniden olusturmasinda Caddy Let's Encrypt'ten YENIDEN sertifika
      # ister -- Let's Encrypt'in domain basina haftalik sertifika siniri
      # var, sik yeniden olusturma bu siniri zorlayabilir.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    # unless-stopped -- ayni gerekce (bkz. RUNBOOK.md A6).
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
